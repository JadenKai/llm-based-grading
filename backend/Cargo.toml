[package]
name = "essay-grader"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
directories = "6.0.0"
eventsource-stream = "0.2.3"
futures = "0.3.34"
harper-core = "2.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["cors", "trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "uuid-impl"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
wiremock = "0.6.5"
